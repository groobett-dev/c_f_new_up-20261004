name: Auto Sync, Obfuscate & Deploy Worker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/byJoey/cfnewup.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories -m "Auto-merge upstream" || git merge upstream/master --allow-unrelated-histories -m "Auto-merge upstream" || echo "No merge needed."
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JavaScript Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate Code
        run: |
          # 提取 import 语句，防止混淆器破坏 ES Module 导入
          grep "^import" _worker.js > imports.js || true
          sed -i '/^import/d' _worker.js || true
          
          javascript-obfuscator _worker.js --output _worker_temp.js --compact true --string-array true --string-array-encoding 'base64' --rename-globals false
          
          # 组装回去
          cat imports.js > _worker_obf.js
          cat _worker_temp.js >> _worker_obf.js
          
          echo "代码混淆完成！"
          ls -lh _worker_obf.js

      - name: Generate Wrangler Config
        run: |
          cat << 'EOF' > wrangler.toml
          name = "cf-new-worker"
          main = "_worker_obf.js"
          compatibility_date = "2023-10-30"

          routes = [
            { pattern = "20261003c_f_new.209app.ccwu.cc", custom_domain = true }
          ]

          [[kv_namespaces]]
          binding = "C"
          id = "bffe84479c1b43c1b04475b57d75e435"
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          command: deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
