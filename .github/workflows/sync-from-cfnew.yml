name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

jobs:
  sync-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          echo "正在获取最新发布信息..."
          LATEST_RELEASE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/byJoey/cfnew/releases/latest)
          
          # 使用 jq 提取 tag_name 与 Pages.zip 的下载链接
          VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')
          if [ -z "$VERSION" ]; then
            # 兼容使用 sed 解析
            VERSION=$(echo "$LATEST_RELEASE" | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p')
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"
          
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name == "Pages.zip") | .browser_download_url // empty' | head -n 1)
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | grep -i "Pages\.zip" | grep -o '"browser_download_url": "[^"]*"' | sed 's/"browser_download_url": "\([^"]*\)"/\1/' | head -1)
          fi
          FILE_NAME="Pages.zip"
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到 Pages.zip 文件"
            echo "返回内容: $LATEST_RELEASE"
            exit 1
          fi
          
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "下载 URL: $DOWNLOAD_URL"
          echo "文件名: $FILE_NAME"
      
      - name: 检查当前版本
        id: check_version
        run: |
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi
          
          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "发现新版本: 当前 '$CURRENT_VERSION' -> 最新 '$NEW_VERSION'，准备更新"
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本一致 ($CURRENT_VERSION)，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"
          
          echo "正在下载文件: $FILE_NAME 来自 $DOWNLOAD_URL"
          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          
          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载失败"
            exit 1
          fi
          
          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d .
          rm -f "$FILE_NAME"
          
          # 更新版本文件
          echo "$VERSION" > VERSION.txt
          echo "版本记录已更新为: $VERSION"
      
      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "chore(sync): 自动同步 cfnew release $VERSION"
            git push origin HEAD:main
            echo "已成功提交并推送到 main 分支"
          fi
      
      - name: 输出摘要
        if: always()
        run: |
          echo "## 同步结果摘要" >> $GITHUB_STEP_SUMMARY
          echo "- **最新版本**: ${{ steps.get_latest.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **之前版本**: ${{ steps.check_version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- **执行状态**: ✅ 已成功同步并推送到仓库" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **执行状态**: ⏭️ 版本相同，跳过同步" >> $GITHUB_STEP_SUMMARY
          fi
